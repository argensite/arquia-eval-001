name: Offline contract quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Historical tags
        shell: python
        run: |
          import subprocess
          expected={'v0.1.0':'b540e71ff2f615197dd886d6e0dbcae3baa62589','v0.1.1':'0ee97e2df0eeff03956782cbf2ce2ef8bc7a7af3','v0.1.2':'49e339f0d57c3794b68e12caa53feabe8ad7710c'}
          for tag, sha in expected.items():
              assert subprocess.check_output(['git','rev-parse',tag+'^{commit}'],text=True).strip()==sha
      - name: Offline acceptance
        run: python check_all.py --output checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: checks
          retention-days: 14
          if-no-files-found: error
  linux-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Linux isolation tool if absent
        run: |
          if ! command -v bwrap; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
          command -v bwrap
          command -v findmnt
      - name: Delegate required controllers on this disposable CI runner
        run: |
          ci_user_id="$(id -u)"
          ci_user_unit="user@${ci_user_id}.service"
          ci_drop_in="/run/systemd/system/${ci_user_unit}.d"
          sudo mkdir -p "$ci_drop_in"
          # systemd 249 defaults to Delegate=pids memory, without CPU quotas.
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "$ci_drop_in/50-arquia-ci.conf"
          sudo systemctl daemon-reload
          # This manager belongs only to this disposable GitHub runner.
          sudo systemctl restart "$ci_user_unit"
          test -S "/run/user/${ci_user_id}/bus"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          unit = f'user@{os.getuid()}.service'
          group = subprocess.check_output(['systemctl', 'show', unit, '-p', 'ControlGroup', '--value'], text=True).strip()
          available = set((Path('/sys/fs/cgroup') / group.lstrip('/') / 'cgroup.controllers').read_text().split())
          missing = {'cpu', 'memory', 'pids'} - available
          print('Delegated controllers:', ' '.join(sorted(available)))
          if missing:
              raise SystemExit('Required isolation controllers unavailable: ' + ', '.join(sorted(missing)))
          PY
      - name: Demonstrate isolation restrictions
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 strict_unittest.py isolation_checks resource_checks
